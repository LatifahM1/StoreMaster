<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>

    <!-- Dashboard Theme -->
    <link rel="stylesheet" href="dashboard.css">

    <script>
        // PAGE PROTECTION
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        // Get product ID from URL
        const productId = new URLSearchParams(window.location.search).get("id");
    </script>

</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <h1>Product Details</h1>

        <div class="nav-actions">
            <a href="index.html" class="btn-add">← Back</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- DETAILS LAYOUT -->
    <div class="details-wrapper">

        <img id="p-img" class="details-img">

        <div class="details-info">
            <h2 id="p-name"></h2>

            <p><strong>Category:</strong> <span id="p-category"></span></p>
            <p><strong>Price:</strong> <span id="p-price"></span> SAR</p>
            <p id="p-description"></p>

            <div class="actions">
                <a id="edit-link" class="btn-edit">Edit</a>
                <button id="deleteBtn" class="btn-delete">Delete</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
